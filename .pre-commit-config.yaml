repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: no-commit-to-branch

  # Local hook: runs the project's own ESLint + flat config. mirrors-eslint
  # installs ESLint in an isolated env without @nuxt/eslint-config.
  # types_or (not types, which ANDs the tags) so any one match lints the file.
  - repo: local
    hooks:
      - id: eslint
        name: lint JS/TS and Vue files
        entry: pnpm exec eslint
        language: system
        types_or:
          - vue
          - javascript
          - ts

  - repo: https://github.com/Weburz/crisp
    rev: v0.1.6
    hooks:
      - id: crisp
        stages: [commit-msg]
        name: lint git-commit messages
